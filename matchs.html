<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900">
    <header class="flex flex-wrap items-center justify-between gap-4 bg-[#111827] px-8 py-4 text-white border-b border-gray-800 ">
    
    <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-full bg-emerald-500 text-white font-bold text-xl">
            ⚽
        </div>
        <div class="flex flex-col">
            <h1 class="font-bold tracking-wider text-lg uppercase leading-tight">TACHKILA</h1>
            <span class="text-xs text-gray-400 uppercase tracking-widest font-medium">ATLAS FC</span>
        </div>
    </div>

    <nav class="flex items-center rounded-lg bg-gray-800/60 p-1 border border-gray-700/50">
        <a href="effectif.html" class="rounded-md  px-5 py-1.5 text-sm font-semibold text-white shadow">
            Effectif
        </a>
        <a href="index.html" class="rounded-md px-5 py-1.5 text-sm font-medium text-gray-300 hover:text-white transition">
            Composition
        </a>
        <a href="matchs.html" class="rounded-md px-5 py-1.5 text-sm bg-green-500 font-medium text-gray-300 hover:text-white transition">
            Matchs
        </a>
    </nav>

    <div class="flex items-center gap-5 text-xs font-semibold tracking-wide text-gray-300">
        <div class="flex items-center gap-2">
            <span class="h-2.5 w-2.5 rounded-full bg-amber-400"></span>
            <span>GB</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="h-2.5 w-2.5 rounded-full bg-blue-500"></span>
            <span>DEF</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="h-2.5 w-2.5 rounded-full bg-emerald-500"></span>
            <span>MIL</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="h-2.5 w-2.5 rounded-full bg-rose-500"></span>
            <span>ATT</span>
        </div>
    </div>
</header>
<main class="main-container min-h-screen h-auto overflow-visible gap-6 p-6 flex flex-col">
    <div id="popup-match" hidden class="fixed inset-0 z-50 flex justify-center items-center bg-black/30 backdrop-blur-xs p-4">

    <section class="ajout-match flex flex-col gap-5 bg-slate-800 p-6 sm:p-8 rounded-lg border border-slate-700 w-full max-w-xl max-h-[90vh] overflow-y-auto">

        <div class="flex justify-between items-center">
            <h1 class="text-xl sm:text-2xl font-bold text-white">
                Ajouter un match
            </h1>

            <button class="text-slate-400 hover:text-white text-xl cursor-pointer bg-red-500/20 hover:bg-red-500 rounded-full w-10 h-10 flex items-center justify-center close-match  "><strong>✕</strong></button>
        </div>

      
        <div class="flex flex-col gap-2">
            <label for="adversaire" class="text-white">Adversaire</label>
            <input
                type="text"
                placeholder="Nom de l'adversaire..."
                id="adversaire"
                class="w-full h-10 px-3 bg-slate-900 text-white border border-slate-600 rounded-md outline-none focus:border-green-500"
            >
        </div>

    
        <div class="flex flex-col sm:flex-row gap-4">

            <div class="flex flex-col gap-2 flex-1">
                <label for="date" class="text-white">Date</label>
                <input
                    type="date"
                    id="date"
                    class="w-full h-10 px-3 bg-slate-900 text-white border border-slate-600 rounded-md outline-none focus:border-green-500"
                >
            </div>

            <div class="flex flex-col gap-2 flex-1">
                <label for="heure" class="text-white">Heure</label>
                <input
                    type="time"
                    id="heure"
                    class="w-full h-10 px-3 bg-slate-900 text-white border border-slate-600 rounded-md outline-none focus:border-green-500"
                >
            </div>

        </div>

        <div class="flex flex-col gap-2">
            <label for="lieu" class="text-white">Lieu</label>
            <input
                type="text"
                placeholder="Lieu du match..."
                id="lieu"
                class="w-full h-10 px-3 bg-slate-900 text-white border border-slate-600 rounded-md outline-none focus:border-green-500"
            >
        </div>

  
        <div class="flex flex-col gap-3">
            <h3 class="text-white font-semibold">Lieu du match</h3>

            <div class="flex flex-col sm:flex-row gap-3">

                <button class=" lieu_btn flex-1 h-10 bg-slate-700 text-white rounded-md font-bold cursor-pointer hover:bg-green-600 transition">
                    Domicile
                </button>

                <button class=" lieu_btn flex-1 h-10 bg-slate-700 text-white rounded-md font-bold cursor-pointer hover:bg-green-600 transition">
                    Extérieur
                </button>

            </div>
        </div>

       
        <div class="flex flex-col-reverse sm:flex-row justify-end gap-3 mt-2">

            <button class="px-5 py-2 bg-slate-700 text-white rounded-md hover:bg-slate-600 cursor-pointer close-match">
                Annuler
            </button>

            <button class="px-5 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 cursor-pointer"  >
                Ajouter le match
            </button>

        </div>

    </section>
</div>
    <div class="flex flex-col gap-3">
    <h1 class="text-4xl font-bold text-white">Matchs</h1>

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <h3 class="text-white opacity-60">Calendrier et résultats de la saison 2026/2027</h3>

        <button class="ajout-btn w-full sm:w-60 h-10 bg-green-500 text-white rounded-md font-bold cursor-pointer text-base" id="aj_matchs">
            + Ajouter un match
        </button>
    </div>
</div>
<div class="grid grid-cols-1 md:grid-cols-[auto_1fr] items-center gap-4 border bg-slate-900 text-white rounded-lg p-4">

    <ul class="flex flex-wrap items-center gap-4 md:gap-2 text-lg">
        <li class="rounded px-3 py-1 whitespace-nowrap cursor-pointer matches">Tous</li>

        <li class="flex items-center gap-2 rounded px-3 py-1 whitespace-nowrap matches cursor-pointer">
            À venir
            <span class="bg-slate-700 text-sm rounded-full px-2 py-1 ">1</span>
        </li>

        <li class="flex items-center gap-2 rounded px-3 py-1 whitespace-nowrap matches cursor-pointer">
            Joués
            <span class="bg-slate-700 text-sm rounded-full px-2 py-1">2</span>
        </li>
    </ul>

    <div class="w-full min-w-0">
        <input
            class="w-full px-4 py-3 text-white rounded bg-slate-800"
            type="text"
            id="search"
            placeholder="Rechercher un adversaire..."
        >
    </div>

</div>
<div class="flex items-center justify-between rounded-xl bg-slate-800 p-4 text-white" id="all">

  

</div>
</main>
</body>
<script type="module" src="matchs.js"></script>
</html>
