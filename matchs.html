<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900">
    <header class="flex flex-wrap items-center justify-between gap-4 bg-[#111827] px-8 py-4 text-white border-b border-gray-800 ">
    
    <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-full bg-emerald-500 text-white font-bold text-xl">
            ⚽
        </div>
        <div class="flex flex-col">
            <h1 class="font-bold tracking-wider text-lg uppercase leading-tight">TACHKILA</h1>
            <span class="text-xs text-gray-400 uppercase tracking-widest font-medium">ATLAS FC</span>
        </div>
    </div>

    <nav class="flex items-center rounded-lg bg-gray-800/60 p-1 border border-gray-700/50">
        <a href="Effectif.html" class="rounded-md  px-5 py-1.5 text-sm font-semibold text-white shadow">
            Effectif
        </a>
        <a href="index.html" class="rounded-md px-5 py-1.5 text-sm font-medium text-gray-300 hover:text-white transition">
            Composition
        </a>
        <a href="matchs.html" class="rounded-md px-5 py-1.5 text-sm bg-green-500 font-medium text-gray-300 hover:text-white transition">
            Matchs
        </a>
    </nav>

    <div class="flex items-center gap-5 text-xs font-semibold tracking-wide text-gray-300">
        <div class="flex items-center gap-2">
            <span class="h-2.5 w-2.5 rounded-full bg-amber-400"></span>
            <span>GB</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="h-2.5 w-2.5 rounded-full bg-blue-500"></span>
            <span>DEF</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="h-2.5 w-2.5 rounded-full bg-emerald-500"></span>
            <span>MIL</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="h-2.5 w-2.5 rounded-full bg-rose-500"></span>
            <span>ATT</span>
        </div>
    </div>
</header>
<main class="main-container min-h-screen h-auto overflow-visible gap-6 p-6 flex flex-col">
    <div id="popup-match" hidden class="fixed inset-0 z-50 flex justify-center items-center bg-black/30 backdrop-blur-xs p-4">

    <section class="ajout-match flex flex-col gap-5 bg-slate-800 p-6 sm:p-8 rounded-lg border border-slate-700 w-full max-w-xl max-h-[90vh] overflow-y-auto">

        <div class="flex justify-between items-center">
            <h1 class="text-xl sm:text-2xl font-bold text-white">
                Ajouter un match
            </h1>

            <button class="text-slate-400 hover:text-white text-xl cursor-pointer bg-red-500/20 hover:bg-red-500 rounded-full w-10 h-10 flex items-center justify-center close-match  "><strong>✕</strong></button>
        </div>

      
        <div class="flex flex-col gap-2">
            <label for="adversaire" class="text-white">Adversaire</label>
            <input
                type="text"
                placeholder="Nom de l'adversaire..."
                id="adversaire" required
                class="w-full h-10 px-3 bg-slate-900 text-white border border-slate-600 rounded-md outline-none focus:border-green-500"
            >
        </div>

    
        <div class="flex flex-col sm:flex-row gap-4">

            <div class="flex flex-col gap-2 flex-1">
                <label for="date" class="text-white">Date</label>
                <input
                    type="date" required
                    id="date"
                    class="w-full h-10 px-3 bg-slate-900 text-white border border-slate-600 rounded-md outline-none focus:border-green-500"
                >
            </div>
            <div class="flex flex-col gap-2 flex-1">
                <label for="heure" class="text-white">Heure</label>
                <input
                    type="time" required
                    id="heure"
                    class="w-full h-10 px-3 bg-slate-900 text-white border border-slate-600 rounded-md outline-none focus:border-green-500"
                >
            </div>

        </div>

        <div class="flex flex-col gap-2">
            <label for="lieu" class="text-white">Lieu</label>
            <input
                type="text" required
                placeholder="Lieu du match..."
                id="lieu"
                class="w-full h-10 px-3 bg-slate-900 text-white border border-slate-600 rounded-md outline-none focus:border-green-500"
            >
        </div>

  
        <div class="flex flex-col gap-3">
            <h3 class="text-white font-semibold">Lieu du match</h3>

            <div class="flex flex-col sm:flex-row gap-3">

                <button class=" lieu_btn flex-1 h-10 bg-slate-700 text-white rounded-md font-bold cursor-pointer  transition">
                    Domicile
                </button>

                <button class=" lieu_btn flex-1 h-10 bg-slate-700 text-white rounded-md font-bold cursor-pointer  transition">
                    Extérieur
                </button>

            </div>
        </div>

       
        <div class="flex flex-col-reverse sm:flex-row justify-end gap-3 mt-2">

            <button class="px-5 py-2 bg-slate-700 text-white rounded-md hover:bg-slate-600 cursor-pointer close-match">
                Annuler
            </button>

            <button class="px-5 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 cursor-pointer" id="sub_btn_matchs" >
                Ajouter le match
            </button>

        </div>

    </section>
</div>
<div id="popup-edit-match"hidden class="fixed inset-0 z-50 flex justify-center items-center bg-black/30 backdrop-blur-xs p-4">

    <section class="edit-match flex flex-col gap-5 bg-slate-800 p-6 sm:p-8 rounded-lg border border-slate-700 w-full max-w-xl max-h-[90vh] overflow-y-auto">

        <div class="flex justify-between items-center">
            <h1 class="text-xl sm:text-2xl font-bold text-white">
                Modifier le match
            </h1>

            <button type="button" class="text-slate-400 hover:text-white text-xl cursor-pointer bg-red-500/20 hover:bg-red-500 rounded-full w-10 h-10 flex items-center justify-center close-edit-match">
                <strong>✕</strong>
            </button>
        </div>

        <div class="flex flex-col gap-2">
            <label for="edit-adversaire" class="text-white">Adversaire</label>
            <input
                type="text"
                placeholder="Nom de l'adversaire..."
                id="edit-adversaire" required
                class="w-full h-10 px-3 bg-slate-900 text-white border border-slate-600 rounded-md outline-none focus:border-green-500"
            >
            <p class="edit-error-adversaire text-red-400 text-sm"></p>
        </div>

        <div class="flex flex-col sm:flex-row gap-4">
            <div class="flex flex-col gap-2 flex-1">
                <label for="edit-date" class="text-white">Date</label>
                <input
                    type="date" required
                    id="edit-date"
                    class="w-full h-10 px-3 bg-slate-900 text-white border border-slate-600 rounded-md outline-none focus:border-green-500"
                >
            </div>

            <div class="flex flex-col gap-2 flex-1">
                <label for="edit-heure" class="text-white">Heure</label>
                <input
                    type="time" required
                    id="edit-heure"
                    class="w-full h-10 px-3 bg-slate-900 text-white border border-slate-600 rounded-md outline-none focus:border-green-500"
                >
            </div>
        </div>

        <div class="flex flex-col gap-2">
            <label for="edit-lieu" class="text-white">Lieu</label>
            <input
                type="text" required
                placeholder="Lieu du match..."
                id="edit-lieu"
                class="w-full h-10 px-3 bg-slate-900 text-white border border-slate-600 rounded-md outline-none focus:border-green-500"
            >
            <p class="edit-error-lieu text-red-400 text-sm"></p>
        </div>

        <div class="flex flex-col gap-3">
            <h3 class="text-white font-semibold">Lieu du match</h3>

            <div class="flex flex-col sm:flex-row gap-3">
                <button type="button" class="edit-lieu_btn flex-1 h-10 bg-slate-700 text-white rounded-md font-bold cursor-pointer transition">
                    Domicile
                </button>

                <button type="button" class="edit-lieu_btn flex-1 h-10 bg-slate-700 text-white rounded-md font-bold cursor-pointer transition">
                    Extérieur
                </button>
            </div>
        </div>
        <div class="flex flex-col-reverse sm:flex-row justify-end gap-3 mt-2">
            <button type="button" class="px-5 py-2 bg-slate-700 text-white rounded-md hover:bg-slate-600 cursor-pointer close-edit-match">
                Annuler
            </button>

            <button type="button" class="px-5 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 cursor-pointer" id="btn-edit-match-submit">
                Enregistrer
            </button>
        </div>

    </section>
</div>
    <div class="flex flex-col gap-3">
    <h1 class="text-4xl font-bold text-white">Matchs</h1>

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <h3 class="text-white opacity-60">Calendrier et résultats de la saison 2026/2027</h3>

        <button class="ajout-btn w-full sm:w-60 h-10 bg-green-500 text-white rounded-md font-bold cursor-pointer text-base" id="aj_matchs">
            + Ajouter un match
        </button>
    </div>
</div>
<div class="grid grid-cols-1 md:grid-cols-[auto_1fr] items-center gap-4 border bg-slate-900 text-white rounded-lg p-4">

    <ul class="flex flex-wrap items-center gap-4 md:gap-2 text-lg">
        <li class="rounded px-3 py-1 whitespace-nowrap cursor-pointer btns matches" data-filtre="tous">Tous</li>

        <li class="flex items-center gap-2 rounded px-3 py-1 whitespace-nowrap matches cursor-pointer btns" data-filtre="avenir">
            À venir
            <span class="bg-slate-700 text-sm rounded-full px-2 py-1 ">1</span>
        </li>

        <li class="flex items-center gap-2 rounded px-3 py-1 whitespace-nowrap matches cursor-pointer btns"  data-filtre="joues">
            Joués
            <span class="bg-slate-700 text-sm rounded-full px-2 py-1">2</span>
        </li>
    </ul>

    <div class="w-full min-w-0">
        <input
            class="w-full px-4 py-3 text-white rounded bg-slate-800"
            type="text" required
            id="search_"
            placeholder="Rechercher un adversaire..."
        >
    </div>

</div>
<div class="flex flex-col gap-4 max-h-[600px] overflow-y-auto" id="all"></div>

  

</div>
<div id="modal-delete" hidden
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">

    <div class="w-full max-w-sm rounded-xl border border-slate-700 bg-slate-900 p-6 text-white">

        <h2 class="mb-3 text-lg font-bold">Supprimer le joueur ?</h2>

        <p id="delete-message" class="mb-6 text-slate-300"></p>

        <div class="flex justify-end gap-3">
            <button id="cancel-delete"
                    class="rounded-lg bg-slate-700 px-4 py-2 hover:bg-slate-600">
                Annuler
            </button>

            <button id="confirm-delete"
                    class="rounded-lg bg-red-500 px-4 py-2 hover:bg-red-600">
                Supprimer
            </button>
        </div>

    </div>
</div>
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 hidden btn_score">

    
    <div class="relative w-full max-w-md rounded-xl border border-slate-600 bg-slate-800 p-6 shadow-xl">

        <!-- X -->
        <button class="absolute right-4 top-4 text-xl text-slate-400 hover:text-white btn_cancel_score">
            &times;
        </button>

        <h3 class="text-white font-semibold text-lg mb-6">Score</h3>

        <!-- Inputs -->
        <div class="flex items-center justify-center gap-4">

            <div class="flex flex-col gap-2 items-center">
                <label for="edit-score-nous" class="text-white text-sm">Atlas FC</label>
                <input type="number" min="0" max="99"
                    id="edit-score-nous"
                    placeholder="0"
                    class="w-20 h-12 text-center text-xl font-bold bg-slate-900 text-white border border-slate-600 rounded-md outline-none focus:border-green-500">
            </div>

            <span class="text-2xl font-bold text-white mt-6">-</span>

            <div class="flex flex-col gap-2 items-center">
                <label for="edit-score-adv" class="text-white text-sm">Adversaire</label>
                <input type="number" min="0" max="99"
                    id="edit-score-adv"
                    placeholder="0"
                    class="w-20 h-12 text-center text-xl font-bold bg-slate-900 text-white border border-slate-600 rounded-md outline-none focus:border-green-500">
            </div>

        </div>

        <p class="edit-error-score text-red-400 text-sm text-center mt-3"></p>

        <div class="flex justify-end gap-3 mt-6">
            <button class="btn_cancel_score rounded-md border border-slate-500 px-4 py-2 text-slate-300 hover:bg-slate-700">
                Annuler
            </button>

            <button class="btn-save rounded-md bg-green-500 px-5 py-2 font-semibold text-white hover:bg-green-600">
                Save
            </button>
        </div>

    </div>
</div>
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 hidden edit_btn_score">

    
    <div class="relative w-full max-w-md rounded-xl border border-slate-600 bg-slate-800 p-6 shadow-xl">

        <!-- X -->
        <button class="absolute right-4 top-4 text-xl text-slate-400 hover:text-white btn_cancel">
            &times;
        </button>

        <h3 class="text-white font-semibold text-lg mb-6">Score</h3>

        <!-- Inputs -->
        <div class="flex items-center justify-center gap-4">

            <div class="flex flex-col gap-2 items-center">
                <label for="score-nous" class="text-white text-sm">Atlas FC</label>
                <input type="number" min="0" max="99"
                    id="score-nous"
                    placeholder="0"
                    class="w-20 h-12 text-center text-xl font-bold bg-slate-900 text-white border border-slate-600 rounded-md outline-none focus:border-green-500">
            </div>

            <span class="text-2xl font-bold text-white mt-6">-</span>

            <div class="flex flex-col gap-2 items-center">
                <label for="score-adv" class="text-white text-sm">Adversaire</label>
                <input type="number" min="0" max="99"
                    id="score-adv"
                    placeholder="0"
                    class="w-20 h-12 text-center text-xl font-bold bg-slate-900 text-white border border-slate-600 rounded-md outline-none focus:border-green-500">
            </div>

        </div>

        <p class="modif_error_msg text-red-400 text-sm text-center mt-3"></p>

        <div class="flex justify-end gap-3 mt-6">
            <button class="btn_cancel rounded-md border border-slate-500 px-4 py-2 text-slate-300 hover:bg-slate-700">
                Annuler
            </button>

            <button class="edit_btn_save rounded-md bg-green-500 px-5 py-2 font-semibold text-white hover:bg-green-600">
                Save
            </button>
        </div>

    </div>
</div>
</main>
</body>
<script type="module" src="matchs.js"></script>
</html>
